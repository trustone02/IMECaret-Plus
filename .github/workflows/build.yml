name: build

# v* 태그를 푸시하면 소스에서 자동 빌드한다. (SignPath 서명 심사 요건: 저장소의 자동 빌드 결과물만 서명)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1

      - name: Make portable zip
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist\out | Out-Null
          Copy-Item installer\Output\IMECaretPlus-Setup.exe dist\out\
          Copy-Item dist\IMECaretPlus.exe dist\out\
          Compress-Archive -Path dist\IMECaretPlus.exe, dist\IMECaretPlus.ini, dist\*.wav -DestinationPath "dist\out\IMECaretPlus-v$v-Portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: IMECaretPlus-build
          path: dist/out/*
          if-no-files-found: error

      # 태그 푸시 시 GitHub Release를 만들고 파일과 SHA256 해시를 함께 올린다.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist\out\* -File
          $hashes = ($files | ForEach-Object { "- ``$($_.Name)``: ``$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)``" }) -join "`n"
          $notes = "## SHA256`n$hashes"
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "$notes" ($files.FullName)
